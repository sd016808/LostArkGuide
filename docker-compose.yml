services:
  lostark-zh:
    build: .
    image: lostark-guide-zh:latest
    container_name: lostark-zh
    restart: unless-stopped
    ports:
      - "7799:3000"          # 對外 7799 → 容器內 3000
    volumes:
      # 網頁與資料直接掛載：更新 public/ 後重新整理網頁即生效
      - ./public:/app/public:ro
      # 伺服器程式也掛載：server.js 更新後只要 `docker compose restart` 即可，不必重建映像
      - ./server.js:/app/server.js:ro
    environment:
      PORT: "3000"
      UPSTREAM: "https://lostark.bible"
      # REMOTE_ID: "1b5dc20"  # 通常不用設，啟動時會自動偵測
    # 若 NAS 需要透過 proxy 連外，取消下面註解
    # environment:
    #   HTTPS_PROXY: "http://proxy:3128"
