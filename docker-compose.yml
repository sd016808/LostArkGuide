services:
  lostark-zh:
    build: .
    image: lostark-guide-zh:latest
    container_name: lostark-zh
    restart: unless-stopped
    ports:
      - "7799:3000"          # 對外 7799 → 容器內 3000
    volumes:
      # 網頁與資料直接掛載：更新 public/ 後重新整理網頁即生效
      - ./public:/app/public:ro
      # 伺服器程式也掛載：server.js 更新後只要 `docker compose restart` 即可，不必重建映像
      - ./server.js:/app/server.js:ro
    environment:
      PORT: "3000"
      UPSTREAM: "https://lostark.bible"
      # REMOTE_ID: "1b5dc20"  # 通常不用設，啟動時會自動偵測
      # --- 限流（以下為預設值，需要調整再取消註解）---
      # RL_API_PER_MIN: "120"        # 每個訪客 IP 每分鐘一般資料請求數
      # RL_LOG_PER_MIN: "10"         # 每個訪客 IP 每分鐘戰鬥紀錄請求數
      # RL_IMAGE_PER_MIN: "600"      # 每個訪客 IP 每分鐘圖片請求數
      # UPSTREAM_CONCURRENCY: "4"    # 對 lostark.bible 同時最多幾個請求
      # UPSTREAM_PER_SEC: "5"        # 對 lostark.bible 每秒最多幾個請求
      # CACHE_MS: "600000"           # 成功回應快取時間（毫秒）
    # 若 NAS 需要透過 proxy 連外，取消下面註解
    # environment:
    #   HTTPS_PROXY: "http://proxy:3128"
